name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="${RUNNER_TEMP}/skevia-secret-scan"
          mkdir -p "${audit_dir}"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${audit_dir}/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "${audit_dir}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "${audit_dir}/gitleaks.tar.gz" -C "${audit_dir}" gitleaks

      - name: Scan history and current files with redacted output
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/skevia-secret-scan/gitleaks" git --redact --log-opts=--all --no-banner .
          "${RUNNER_TEMP}/skevia-secret-scan/gitleaks" dir --redact --no-banner .
